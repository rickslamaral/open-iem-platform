<style>.title{font:700 38px Arial;fill:#f1f6ff}.sub{font:18px Arial;fill:#a9bad1}.h{font:700 25px Arial;fill:#f1f6ff}.body{font:16px Arial;fill:#d8e4f5}.muted{font:15px Arial;fill:#9db0c8}.mono{font:16px monospace;fill:#e5eeff}.panel{fill:#10233d;stroke:#2c4a70;stroke-width:2}.control{fill:#172f52;stroke:#668fff;stroke-width:2}.active{fill:#163e42;stroke:#26c9b5;stroke-width:2}.warn{fill:#3d3020;stroke:#d9a441;stroke-width:2}.danger{fill:#432733;stroke:#e5778d;stroke-width:2}.purple{fill:#392852;stroke:#c47aff;stroke-width:2}.bar{fill:#263f62}.fill{fill:#30c9b6}</style>
<text x="65" y="68" class="title">Open IEM Platform</text><text x="65" y="103" class="h">Controles de mix — ganho, mute e pan</text><text x="65" y="134" class="sub">Referência visual dos controles documentados; áudio no VPS permanece SIMULATED</text><rect x="55" y="170" width="1490" height="760" rx="12" class="panel"/><rect x="95" y="250" width="310" height="270" rx="12" class="control"/><text x="120" y="295" class="h">GAIN</text><text x="120" y="355" class="h" fill="#36d3bf">-6.0 dB</text><rect x="120" y="400" width="260" height="10" rx="5" class="bar"/><rect x="120" y="400" width="150" height="10" rx="5" class="fill"/><text x="120" y="480" class="muted">PUT /api/v1/channels/{index}/gain</text><rect x="445" y="250" width="310" height="270" rx="12" class="control"/><text x="470" y="295" class="h">MUTE</text><text x="470" y="355" class="h" fill="#36d3bf">OFF</text><rect x="470" y="400" width="260" height="10" rx="5" class="bar"/><rect x="470" y="400" width="150" height="10" rx="5" class="fill"/><text x="470" y="480" class="muted">PUT /api/v1/channels/{index}/mute</text><rect x="795" y="250" width="310" height="270" rx="12" class="control"/><text x="820" y="295" class="h">PAN</text><text x="820" y="355" class="h" fill="#36d3bf">L 20</text><rect x="820" y="400" width="260" height="10" rx="5" class="bar"/><rect x="820" y="400" width="150" height="10" rx="5" class="fill"/><text x="820" y="480" class="muted">PUT /api/v1/mixes/{mix_idx}/sends/{ch_idx}/pan</text><rect x="1145" y="250" width="310" height="270" rx="12" class="control"/><text x="1170" y="295" class="h">AUDIO</text><text x="1170" y="355" class="h" fill="#f0c971">SIMULATED</text><rect x="1170" y="400" width="260" height="10" rx="5" class="bar"/><rect x="1170" y="400" width="260" height="10" rx="5" class="fill"/><text x="1170" y="480" class="muted">POST /api/v1/audio/offer</text><text x="95" y="630" class="h">WebSocket de controle</text><rect x="95" y="665" width="1380" height="85" rx="12" class="purple"/><text x="125" y="710" class="mono">openiem.v1  ·  SetChannelGain  ·  SetChannelMute  ·  token no subprotocolo</text><text x="95" y="830" class="muted">Ownership: músico acessa somente mix atribuído; Engineer/Admin operam mix válidos.</text></svg>
