<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#081426"/><rect width="1600" height="10" fill="#27c9b8"/>
<style>.title{font:700 38px Arial;fill:#f1f6ff}.sub{font:18px Arial;fill:#a9bad1}.h{font:700 25px Arial;fill:#f1f6ff}.body{font:16px Arial;fill:#d8e4f5}.muted{font:15px Arial;fill:#9db0c8}.mono{font:16px monospace;fill:#e5eeff}.panel{fill:#10233d;stroke:#2c4a70;stroke-width:2}.control{fill:#172f52;stroke:#668fff;stroke-width:2}.active{fill:#163e42;stroke:#26c9b5;stroke-width:2}.warn{fill:#3d3020;stroke:#d9a441;stroke-width:2}.danger{fill:#432733;stroke:#e5778d;stroke-width:2}.purple{fill:#392852;stroke:#c47aff;stroke-width:2}.bar{fill:#263f62}.fill{fill:#30c9b6}</style>
<text x="65" y="68" class="title">Open IEM Platform</text><text x="65" y="103" class="h">Admin — CLI e API, sem painel web</text><text x="65" y="134" class="sub">Mockup documental: o repositório não possui interface Admin web; comandos reais estão em server/admin-cli</text><rect x="55" y="170" width="1490" height="760" rx="12" class="panel"/><text x="90" y="215" class="h">ADMIN OPERATIONS</text><rect x="90" y="250" width="1390" height="100" rx="12" class="panel"/><text x="120" y="290" class="mono">$ open-iem-admin health</text><text x="120" y="325" class="body" fill="#36d3bf">{&quot;status&quot;:&quot;ok&quot;}</text><rect x="90" y="390" width="1390" height="430" rx="12" class="purple"/><text x="120" y="435" class="h">Comandos suportados</text><text x="135" y="490" class="mono">open-iem-admin health</text><text x="720" y="490" class="body">GET /api/v1/health</text><text x="135" y="538" class="mono">open-iem-admin user list</text><text x="720" y="538" class="body">GET /api/v1/admin/users</text><text x="135" y="586" class="mono">open-iem-admin user create</text><text x="720" y="586" class="body">POST /api/v1/admin/users</text><text x="135" y="634" class="mono">open-iem-admin user delete --id 7</text><text x="720" y="634" class="body">DELETE /api/v1/admin/users/7</text><text x="135" y="682" class="mono">open-iem-admin session list</text><text x="720" y="682" class="body">GET /api/v1/admin/sessions</text><text x="135" y="730" class="mono">open-iem-admin session revoke --id 12</text><text x="720" y="730" class="body">DELETE /api/v1/admin/sessions/12</text><rect x="90" y="855" width="1390" height="45" rx="12" class="warn"/><text x="120" y="884" class="body" fill="#f0c971">ADMIN: gerenciamento de usuários e sessões · sem criação via Engineer UI</text></svg>
