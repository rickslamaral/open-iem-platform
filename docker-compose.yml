version: "3.9"

# Open IEM Platform — Local Development Compose
#
# TARGET: VPS / developer workstation. No audio hardware required.
# All audio paths are SIMULATED (no PipeWire/ALSA).
#
# Usage:
#   docker compose up --build
#
# Access:
#   API server:      http://localhost:3000
#   Musician PWA:    http://localhost:5173  (Vite dev server)
#   Engineer UI:     http://localhost:5174  (Vite dev server)
#
# Security note: HTTP only — localhost/LAN dev exception.
# Before any external exposure, terminate TLS via Caddy or Nginx.

services:
  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
      target: api-server
    ports:
      - "3000:3000"
    environment:
      # Dev-only: loopback bind, HTTP, allow non-loopback with OPEN_IEM_DEV_ALLOW_NON_LOOPBACK
      OPEN_IEM_BIND: "0.0.0.0:3000"
      OPEN_IEM_DEV_ALLOW_NON_LOOPBACK: "true"
      OPEN_IEM_DB_PATH: "/data/open-iem.db"
      # Keys must be mounted at runtime — never committed.
      # Generate with: openssl genpkey -algorithm ed25519 -out jwt_private.pem
      #                openssl pkey -in jwt_private.pem -pubout -out jwt_public.pem
      OPEN_IEM_JWT_PRIVATE_KEY_PATH: "/secrets/jwt_private.pem"
      OPEN_IEM_JWT_PUBLIC_KEY_PATH: "/secrets/jwt_public.pem"
      RUST_LOG: "open_iem=debug,tower_http=info"
    volumes:
      - api-data:/data
      - ./secrets:/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  musician-ui:
    build:
      context: ./web/musician
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:3000"
    volumes:
      - ./web/musician/src:/app/src
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped

  engineer-ui:
    build:
      context: ./web/engineer
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: "http://localhost:3000"
    volumes:
      - ./web/engineer/src:/app/src
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
