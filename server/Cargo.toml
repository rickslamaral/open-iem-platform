[workspace]
resolver = "2"
members = [
    "mix-engine",
    "audio-engine",
    "control-protocol",
    "control-server",
    "api-server",
    "streaming",
    "admin-cli",
    "topology",
    "device-manager",
    "observability",
    "recovery",
    "network-fault",
    "config-backup",
    "scene-manager",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["Open IEM Platform Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rickslamaral/open-iem-platform"

[workspace.lints.rust]
# Workspace policy: deny unsafe code everywhere.
# Exception: audio-engine's JACK backend must implement one unsafe trait method
# (NotificationHandler::shutdown is declared unsafe in JACK 0.13). That impl
# carries an explicit #[allow(unsafe_code)] + SAFETY comment; all other crates
# remain fully unsafe-free.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow some pedantic lints that are too noisy for audio DSP code
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
