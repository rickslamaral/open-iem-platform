[package]
name = "streaming"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# WebRTC (Sans-IO, no external media engine dependency)
str0m = "0.23"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2"
sha2 = "0.11"
argon2 = "0.6"
rand = "0.10"

# Logging
tracing = "0.1"

# Lock-free bounded channel for media frame routing (ADR-007)
crossbeam-channel = "0.5"

# Mix engine types (FrameOutput, MAX_MIXES)
mix-engine = { path = "../mix-engine" }

# Pure-Rust Opus decoder; avoids host libopus dependency in CI.
opus-pure = "0.2.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
