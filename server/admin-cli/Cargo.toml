[package]
name = "admin-cli"
version = "0.1.0"
edition = "2021"
description = "Open IEM Platform — Admin CLI for user management"

[[bin]]
name = "open-iem-admin"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

[lints]
workspace = true
