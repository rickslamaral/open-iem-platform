name: Software Release Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-amd64:
    name: .deb amd64 package gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - run: cargo build --manifest-path server/Cargo.toml --release --bins
      - run: ARCH=amd64 packaging/deb/build-deb.sh
      - run: python3 scripts/validate-deb-package.py dist/open-iem_$(cat VERSION)_amd64.deb
      - run: scripts/ci/run-package-lifecycle.sh dist/open-iem_$(cat VERSION)_amd64.deb

  package-arm64:
    name: .deb arm64 package gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc cargo build --manifest-path server/Cargo.toml --target aarch64-unknown-linux-gnu --release --bins
      - run: ARCH=arm64 API_BIN=server/target/aarch64-unknown-linux-gnu/release/api-server ADMIN_BIN=server/target/aarch64-unknown-linux-gnu/release/open-iem-admin packaging/deb/build-deb.sh
      - run: python3 scripts/validate-deb-package.py dist/open-iem_$(cat VERSION)_arm64.deb

  arm64-userspace:
    name: Raspberry Pi OS-compatible ARM64 userspace smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - run: docker build --platform linux/arm64 -f deployment/docker/raspberrypi-os-smoke/Dockerfile -t open-iem-platform/raspberrypi-os-smoke:ci .
      - run: docker run --rm --platform linux/arm64 open-iem-platform/raspberrypi-os-smoke:ci
