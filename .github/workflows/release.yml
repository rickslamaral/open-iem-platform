name: Release

on:
  push:
    # Glob selects candidate tags; validate-version enforces exact SemVer.
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # 1. Validate version consistency
  # ──────────────────────────────────────────────
  validate-version:
    name: Validate version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate canonical project version
        id: extract
        run: |
          VERSION=$(TAG="${GITHUB_REF_NAME}" python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib

          root = pathlib.Path('.')
          version = (root / 'VERSION').read_text(encoding='utf-8').strip()
          if re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version) is None:
              raise SystemExit('VERSION must contain exact SemVer X.Y.Z')
          cargo = tomllib.loads((root / 'server/Cargo.toml').read_text(encoding='utf-8'))
          manifests = [cargo['workspace']['package']['version']]
          manifests.extend(json.loads((root / path).read_text(encoding='utf-8'))['version'] for path in ('web/musician/package.json', 'web/engineer/package.json'))
          if any(candidate != version for candidate in manifests):
              raise SystemExit('VERSION does not match every project manifest')
          tag = os.environ['TAG']
          if re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag) is None or tag[1:] != version:
              raise SystemExit('tag does not match VERSION')
          print(version)
          PY
          )
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag and all manifests match canonical VERSION: ${VERSION}"

  # ──────────────────────────────────────────────
  # 2. Quality gate (same as CI but required for release)
  # ──────────────────────────────────────────────
  quality-gate:
    name: Quality gate (fmt + clippy + tests + audit)
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Format check
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --manifest-path server/Cargo.toml --all --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Security audit
        run: |
          # RUSTSEC-2023-0071: rsa crate (Marvin Attack) — transitively pulled by
          # jsonwebtoken/rust_crypto. Accept residual only after proving JWT uses EdDSA.
          ! grep -RE 'Algorithm::(RSA|HS|ES|RS|PS)' server/api-server/src/auth.rs
          grep -q 'Algorithm::EdDSA' server/api-server/src/auth.rs
          cargo audit --file server/Cargo.lock --ignore RUSTSEC-2023-0071

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify musician frontend
        run: |
          npm ci --prefix web/musician
          npm run typecheck --prefix web/musician
          npm test --prefix web/musician -- --run
          npm audit --audit-level=high --prefix web/musician

      - name: Verify engineer frontend
        run: |
          npm ci --prefix web/engineer
          npm run typecheck --prefix web/engineer
          npm test --prefix web/engineer -- --run
          npm audit --audit-level=high --prefix web/engineer

  # ──────────────────────────────────────────────
  # 3. Build server — Linux x86_64
  # ──────────────────────────────────────────────
  build-server-x86:
    name: Build server (Linux x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [quality-gate, validate-version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-x86-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-x86-

      - name: Build release binaries
        run: |
          cargo build --manifest-path server/Cargo.toml --release --locked \
            --bin api-server \
            --bin open-iem-admin

      - name: Generate SBOM (best-effort)
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          if cargo install cargo-sbom --locked 2>/dev/null; then
            cargo sbom --manifest-path server/Cargo.toml > "open-iem-server-${VERSION}-sbom.json" \
              || echo "WARNING: cargo-sbom run failed; skipping SBOM"
          else
            echo "WARNING: cargo-sbom install failed; skipping SBOM"
          fi
        continue-on-error: true

      - name: Package server artefact
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${GITHUB_SHA}")
          export SOURCE_DATE_EPOCH
          ARCH="x86_64-linux"
          DIR="open-iem-server-${VERSION}-${ARCH}"
          mkdir -p "${DIR}"
          cp server/target/release/api-server "${DIR}/"
          cp server/target/release/open-iem-admin "${DIR}/"
          cp README.md LICENSE "${DIR}/"
          cp CHANGELOG.md "${DIR}/" || true
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -czf "${DIR}.tar.gz" "${DIR}"
          python3 scripts/validate-release-archive.py "${DIR}.tar.gz" api-server open-iem-admin
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          test -n "${OPENIEM_RELEASE_SIGNING_KEY_PEM:-}" || {
            printf '%s\n' 'Missing OPENIEM_RELEASE_SIGNING_KEY_PEM' >&2
            exit 1
          }
          KEY_FILE=$(mktemp)
          trap 'rm -f -- "$KEY_FILE"' EXIT
          chmod 600 "$KEY_FILE"
          printf '%s' "${OPENIEM_RELEASE_SIGNING_KEY_PEM}" > "$KEY_FILE"
          /usr/bin/openssl pkey -in "$KEY_FILE" -text -noout 2>/dev/null | grep -q '^ED25519' || {
            printf '%s\n' 'Signing key must be Ed25519' >&2
            exit 1
          }
          /usr/bin/openssl pkeyutl -sign -rawin -inkey "$KEY_FILE" \
            -in "${DIR}.tar.gz" -out "${DIR}.tar.gz.sig"
          test -s "${DIR}.tar.gz.sig"
          test -n "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM:-}" || {
            printf '%s\n' 'Missing OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM repository variable' >&2
            exit 1
          }
          [[ "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT:-}" =~ ^[0-9A-Fa-f]{64}$ ]] || {
            printf '%s\n' 'Missing or malformed OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT repository variable' >&2
            exit 1
          }
          PUBLIC_KEY_FILE=$(mktemp)
          trap 'rm -f -- "$KEY_FILE" "$PUBLIC_KEY_FILE"' EXIT
          chmod 644 "$PUBLIC_KEY_FILE"
          printf '%s' "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM}" > "$PUBLIC_KEY_FILE"
          ACTUAL_PUBLIC_KEY_FINGERPRINT=$(/usr/bin/openssl pkey -pubin -in "$PUBLIC_KEY_FILE" -outform DER | sha256sum | cut -d' ' -f1)
          [[ "${ACTUAL_PUBLIC_KEY_FINGERPRINT}" == "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT,,}" ]] || {
            printf '%s\n' 'Release signing public key fingerprint mismatch' >&2
            exit 1
          }
          python3 scripts/verify-release-signature.py \
            "${DIR}.tar.gz" "${DIR}.tar.gz.sig" "$PUBLIC_KEY_FILE"
          echo "Artefact: ${DIR}.tar.gz"
          cat "${DIR}.tar.gz.sha256"
        env:
          OPENIEM_RELEASE_SIGNING_KEY_PEM: ${{ secrets.OPENIEM_RELEASE_SIGNING_KEY_PEM }}
          OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM: ${{ vars.OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
          OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ vars.OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT }}

      - name: Attest server archive provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: open-iem-server-*.tar.gz

      - name: Upload artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-x86_64-linux
          if-no-files-found: error
          path: |
            open-iem-server-*.tar.gz
            open-iem-server-*.tar.gz.sig
            open-iem-server-*.tar.gz.sha256
            open-iem-server-*-sbom.json

  # ──────────────────────────────────────────────
  # 4. Build server — Linux ARM64 (Raspberry Pi 5 target)
  # ──────────────────────────────────────────────
  build-server-arm64:
    name: Build server (Linux ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [quality-gate, validate-version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable + ARM64 target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install ARM64 cross-linker
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-arm64-

      - name: Build release binaries (ARM64)
        run: |
          cargo build --manifest-path server/Cargo.toml --release --locked \
            --target aarch64-unknown-linux-gnu \
            --bin api-server \
            --bin open-iem-admin
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package ARM64 artefact
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${GITHUB_SHA}")
          export SOURCE_DATE_EPOCH
          ARCH="aarch64-linux"
          DIR="open-iem-server-${VERSION}-${ARCH}"
          mkdir -p "${DIR}"
          cp server/target/aarch64-unknown-linux-gnu/release/api-server "${DIR}/"
          cp server/target/aarch64-unknown-linux-gnu/release/open-iem-admin "${DIR}/"
          cp README.md LICENSE "${DIR}/"
          cp CHANGELOG.md "${DIR}/" || true
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -czf "${DIR}.tar.gz" "${DIR}"
          python3 scripts/validate-release-archive.py "${DIR}.tar.gz" api-server open-iem-admin
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          test -n "${OPENIEM_RELEASE_SIGNING_KEY_PEM:-}" || {
            printf '%s\n' 'Missing OPENIEM_RELEASE_SIGNING_KEY_PEM' >&2
            exit 1
          }
          KEY_FILE=$(mktemp)
          trap 'rm -f -- "$KEY_FILE"' EXIT
          chmod 600 "$KEY_FILE"
          printf '%s' "${OPENIEM_RELEASE_SIGNING_KEY_PEM}" > "$KEY_FILE"
          /usr/bin/openssl pkey -in "$KEY_FILE" -text -noout 2>/dev/null | grep -q '^ED25519' || {
            printf '%s\n' 'Signing key must be Ed25519' >&2
            exit 1
          }
          /usr/bin/openssl pkeyutl -sign -rawin -inkey "$KEY_FILE" \
            -in "${DIR}.tar.gz" -out "${DIR}.tar.gz.sig"
          test -s "${DIR}.tar.gz.sig"
          test -n "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM:-}" || {
            printf '%s\n' 'Missing OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM repository variable' >&2
            exit 1
          }
          [[ "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT:-}" =~ ^[0-9A-Fa-f]{64}$ ]] || {
            printf '%s\n' 'Missing or malformed OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT repository variable' >&2
            exit 1
          }
          PUBLIC_KEY_FILE=$(mktemp)
          trap 'rm -f -- "$KEY_FILE" "$PUBLIC_KEY_FILE"' EXIT
          chmod 644 "$PUBLIC_KEY_FILE"
          printf '%s' "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM}" > "$PUBLIC_KEY_FILE"
          ACTUAL_PUBLIC_KEY_FINGERPRINT=$(/usr/bin/openssl pkey -pubin -in "$PUBLIC_KEY_FILE" -outform DER | sha256sum | cut -d' ' -f1)
          [[ "${ACTUAL_PUBLIC_KEY_FINGERPRINT}" == "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT,,}" ]] || {
            printf '%s\n' 'Release signing public key fingerprint mismatch' >&2
            exit 1
          }
          python3 scripts/verify-release-signature.py \
            "${DIR}.tar.gz" "${DIR}.tar.gz.sig" "$PUBLIC_KEY_FILE"
          echo "Artefact: ${DIR}.tar.gz"
          cat "${DIR}.tar.gz.sha256"
        env:
          OPENIEM_RELEASE_SIGNING_KEY_PEM: ${{ secrets.OPENIEM_RELEASE_SIGNING_KEY_PEM }}
          OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM: ${{ vars.OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
          OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ vars.OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT }}

      - name: Attest server archive provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: open-iem-server-*.tar.gz

      - name: Upload artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-aarch64-linux
          if-no-files-found: error
          path: |
            open-iem-server-*.tar.gz
            open-iem-server-*.tar.gz.sig
            open-iem-server-*.tar.gz.sha256

  # ──────────────────────────────────────────────
  # 5. Build web frontends
  # ──────────────────────────────────────────────
  build-web:
    name: Build web frontends
    runs-on: ubuntu-latest
    needs: [quality-gate, validate-version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build musician PWA
        run: |
          if [ -f web/musician/package.json ]; then
            npm ci --prefix web/musician
            npm run build --prefix web/musician
          fi

      - name: Build engineer UI
        run: |
          if [ -f web/engineer/package.json ]; then
            npm ci --prefix web/engineer
            npm run build --prefix web/engineer
          fi

      - name: Package web artefacts
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate-version.outputs.version }}"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${GITHUB_SHA}")
          export SOURCE_DATE_EPOCH
          test -d web/musician/dist
          test -d web/engineer/dist
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -czf "open-iem-musician-pwa-${VERSION}.tar.gz" -C web/musician dist
          sha256sum "open-iem-musician-pwa-${VERSION}.tar.gz" > "open-iem-musician-pwa-${VERSION}.tar.gz.sha256"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -czf "open-iem-engineer-ui-${VERSION}.tar.gz" -C web/engineer dist
          sha256sum "open-iem-engineer-ui-${VERSION}.tar.gz" > "open-iem-engineer-ui-${VERSION}.tar.gz.sha256"

      - name: Upload web artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          if-no-files-found: error
          path: |
            open-iem-musician-pwa-*.tar.gz
            open-iem-musician-pwa-*.tar.gz.sha256
            open-iem-engineer-ui-*.tar.gz
            open-iem-engineer-ui-*.tar.gz.sha256

  # ──────────────────────────────────────────────
  # 6. Create GitHub Release with all artefacts
  # ──────────────────────────────────────────────
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - validate-version
      - build-server-x86
      - build-server-arm64
      - build-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/

      - name: Flatten artefact directories
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            target="dist/$(basename -- "${file}")"
            if [ "${file}" != "${target}" ] && [ -e "${target}" ]; then
              printf 'duplicate artifact name: %s\n' "${target}" >&2
              exit 1
            fi
            if [ "${file}" != "${target}" ]; then
              mv -- "${file}" "${target}"
            fi
          done < <(find dist/ -mindepth 2 -type f \( -name "*.tar.gz" -o -name "*.tar.gz.sig" -o -name "*.sha256" -o -name "*-sbom.json" \) -print0)
          find dist/ -mindepth 1 -depth -type d -empty -delete
          ls -lh dist/*.tar.gz dist/*.tar.gz.sig dist/*.sha256 2>/dev/null || true
          test -z "$(find dist/ -mindepth 1 -type d -print -quit)" || {
            printf '%s\n' 'unexpected non-empty artifact directory' >&2
            exit 1
          }

      - name: Validate assembled release bundle
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM: ${{ vars.OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
          OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT: ${{ vars.OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM:-}" || {
            printf '%s\n' 'Missing OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM repository variable' >&2
            exit 1
          }
          [[ "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT:-}" =~ ^[0-9A-Fa-f]{64}$ ]] || {
            printf '%s\n' 'Missing or malformed OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT repository variable' >&2
            exit 1
          }
          PUBLIC_KEY_FILE=$(mktemp)
          MANIFEST_FILE=$(mktemp)
          trap 'rm -f -- "$PUBLIC_KEY_FILE" "$MANIFEST_FILE"' EXIT
          chmod 644 "$PUBLIC_KEY_FILE"
          printf '%s' "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_PEM}" > "$PUBLIC_KEY_FILE"
          ACTUAL_PUBLIC_KEY_FINGERPRINT=$(/usr/bin/openssl pkey -pubin -in "$PUBLIC_KEY_FILE" -outform DER | sha256sum | cut -d' ' -f1)
          [[ "${ACTUAL_PUBLIC_KEY_FINGERPRINT}" == "${OPENIEM_RELEASE_SIGNING_PUBLIC_KEY_FINGERPRINT,,}" ]] || {
            printf '%s\n' 'Release signing public key fingerprint mismatch' >&2
            exit 1
          }
          test ! -e release-upload && test ! -L release-upload
          python3 scripts/validate-release-bundle.py dist "${RELEASE_VERSION}" --public-key "$PUBLIC_KEY_FILE" --manifest "$MANIFEST_FILE" --output release-upload
          while read -r digest name; do
            printf '%s  %s\n' "${digest}" "release-upload/${name}"
          done < "$MANIFEST_FILE" > release-files.txt
          sha256sum -c <(sed 's#  #  release-upload/#' "$MANIFEST_FILE")
          cp --reflink=auto -- "$MANIFEST_FILE" release-manifest.sha256
          printf '%s\n' release-manifest.sha256 >> release-files.txt
          test -s release-files.txt

      - name: Extract CHANGELOG excerpt for release notes
        id: notes
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md 2>/dev/null || true)
          if [ -z "${NOTES}" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          # Write to file to handle multiline
          echo "${NOTES}" > release_notes.txt
          cat release_notes.txt

      - name: Create GitHub Release from validated manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t RELEASE_FILES < release-files.txt
          gh release create "$GITHUB_REF_NAME" \
            --title "Open IEM Platform ${RELEASE_VERSION}" \
            --notes-file release_notes.txt \
            "${RELEASE_FILES[@]}"
