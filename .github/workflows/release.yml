name: Release

on:
  push:
    tags:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+"

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # 1. Validate version consistency
  # ──────────────────────────────────────────────
  validate-version:
    name: Validate version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version
        id: extract
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG} → version: ${VERSION}"

      - name: Check Cargo workspace version matches tag
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          CARGO_VERSION=$(grep '^version' server/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Cargo workspace version: ${CARGO_VERSION}"
          if [ "${CARGO_VERSION}" != "${VERSION}" ]; then
            echo "ERROR: Tag version ${VERSION} does not match Cargo workspace version ${CARGO_VERSION}"
            exit 1
          fi

      - name: Check frontend versions match tag
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          for PACKAGE in web/musician/package.json web/engineer/package.json; do
            PKG_VERSION=$(node -p "require('./${PACKAGE}').version")
            echo "${PACKAGE} version: ${PKG_VERSION}"
            if [ "${PKG_VERSION}" != "${VERSION}" ]; then
              echo "ERROR: ${PACKAGE} version (${PKG_VERSION}) does not match tag (${VERSION})"
              exit 1
            fi
          done

  # ──────────────────────────────────────────────
  # 2. Quality gate (same as CI but required for release)
  # ──────────────────────────────────────────────
  quality-gate:
    name: Quality gate (fmt + clippy + tests + audit)
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Format check
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path server/Cargo.toml --all

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: |
          # RUSTSEC-2023-0071: rsa crate (Marvin Attack) — transitively pulled by
          # jsonwebtoken/rust_crypto; Open IEM uses EdDSA only, RSA never executed.
          cargo audit --file server/Cargo.lock --ignore RUSTSEC-2023-0071

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify musician frontend
        run: |
          npm ci --prefix web/musician
          npm run typecheck --prefix web/musician
          npm test --prefix web/musician -- --run
          npm audit --audit-level=high --prefix web/musician

      - name: Verify engineer frontend
        run: |
          npm ci --prefix web/engineer
          npm run typecheck --prefix web/engineer
          npm test --prefix web/engineer -- --run
          npm audit --audit-level=high --prefix web/engineer

  # ──────────────────────────────────────────────
  # 3. Build server — Linux x86_64
  # ──────────────────────────────────────────────
  build-server-x86:
    name: Build server (Linux x86_64)
    runs-on: ubuntu-latest
    needs: [quality-gate, validate-version]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-x86-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-x86-

      - name: Build release binaries
        run: |
          cargo build --manifest-path server/Cargo.toml --release \
            --bin api-server \
            --bin open-iem-admin

      - name: Generate SBOM (best-effort)
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          if cargo install cargo-sbom --locked 2>/dev/null; then
            cargo sbom --manifest-path server/Cargo.toml > "open-iem-server-${VERSION}-sbom.json" \
              || echo "WARNING: cargo-sbom run failed; skipping SBOM"
          else
            echo "WARNING: cargo-sbom install failed; skipping SBOM"
          fi
        continue-on-error: true

      - name: Package server artefact
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          ARCH="x86_64-linux"
          DIR="open-iem-server-${VERSION}-${ARCH}"
          mkdir -p "${DIR}"
          cp server/target/release/api-server "${DIR}/"
          cp server/target/release/open-iem-admin "${DIR}/"
          cp README.md LICENSE "${DIR}/"
          cp CHANGELOG.md "${DIR}/" || true
          tar -czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Artefact: ${DIR}.tar.gz"
          cat "${DIR}.tar.gz.sha256"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: server-x86_64-linux
          path: |
            open-iem-server-*.tar.gz
            open-iem-server-*.tar.gz.sha256
            open-iem-server-*-sbom.json

  # ──────────────────────────────────────────────
  # 4. Build server — Linux ARM64 (Raspberry Pi 5 target)
  # ──────────────────────────────────────────────
  build-server-arm64:
    name: Build server (Linux ARM64)
    runs-on: ubuntu-latest
    needs: [quality-gate, validate-version]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install ARM64 cross-linker
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-arm64-

      - name: Build release binaries (ARM64)
        run: |
          cargo build --manifest-path server/Cargo.toml --release \
            --target aarch64-unknown-linux-gnu \
            --bin api-server \
            --bin open-iem-admin
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package ARM64 artefact
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          ARCH="aarch64-linux"
          DIR="open-iem-server-${VERSION}-${ARCH}"
          mkdir -p "${DIR}"
          cp server/target/aarch64-unknown-linux-gnu/release/api-server "${DIR}/"
          cp server/target/aarch64-unknown-linux-gnu/release/open-iem-admin "${DIR}/"
          cp README.md LICENSE "${DIR}/"
          cp CHANGELOG.md "${DIR}/" || true
          tar -czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "Artefact: ${DIR}.tar.gz"
          cat "${DIR}.tar.gz.sha256"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: server-aarch64-linux
          path: |
            open-iem-server-*.tar.gz
            open-iem-server-*.tar.gz.sha256

  # ──────────────────────────────────────────────
  # 5. Build web frontends
  # ──────────────────────────────────────────────
  build-web:
    name: Build web frontends
    runs-on: ubuntu-latest
    needs: [quality-gate, validate-version]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build musician PWA
        run: |
          if [ -f web/musician/package.json ]; then
            npm ci --prefix web/musician
            npm run build --prefix web/musician
          fi

      - name: Build engineer UI
        run: |
          if [ -f web/engineer/package.json ]; then
            npm ci --prefix web/engineer
            npm run build --prefix web/engineer
          fi

      - name: Package web artefacts
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          # Musician PWA
          if [ -d web/musician/dist ]; then
            tar -czf "open-iem-musician-pwa-${VERSION}.tar.gz" -C web/musician dist
            sha256sum "open-iem-musician-pwa-${VERSION}.tar.gz" > "open-iem-musician-pwa-${VERSION}.tar.gz.sha256"
          fi
          # Engineer UI
          if [ -d web/engineer/dist ]; then
            tar -czf "open-iem-engineer-ui-${VERSION}.tar.gz" -C web/engineer dist
            sha256sum "open-iem-engineer-ui-${VERSION}.tar.gz" > "open-iem-engineer-ui-${VERSION}.tar.gz.sha256"
          fi

      - name: Upload web artefacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            open-iem-musician-pwa-*.tar.gz
            open-iem-musician-pwa-*.tar.gz.sha256
            open-iem-engineer-ui-*.tar.gz
            open-iem-engineer-ui-*.tar.gz.sha256

  # ──────────────────────────────────────────────
  # 6. Create GitHub Release with all artefacts
  # ──────────────────────────────────────────────
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate-version
      - build-server-x86
      - build-server-arm64
      - build-web
    steps:
      - uses: actions/checkout@v4

      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artefact directories
        run: |
          find dist/ -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec mv {} dist/ \;
          ls -lh dist/*.tar.gz dist/*.sha256 2>/dev/null || true

      - name: Extract CHANGELOG excerpt for release notes
        id: notes
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md 2>/dev/null || true)
          if [ -z "${NOTES}" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          # Write to file to handle multiline
          echo "${NOTES}" > release_notes.txt
          cat release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Open IEM Platform ${{ needs.validate-version.outputs.version }}"
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
