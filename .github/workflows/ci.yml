name: CI

on:
  # Validate proposed changes and preserve post-merge evidence on main.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust Format + Clippy + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          if [ -f server/Cargo.toml ]; then
            cargo fmt --manifest-path server/Cargo.toml --all -- --check
          else
            echo "No Cargo.toml yet — skipping fmt"
          fi

      - name: Clippy
        run: |
          if [ -f server/Cargo.toml ]; then
            cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
          else
            echo "No Cargo.toml yet — skipping clippy"
          fi

      - name: Tests
        run: |
          if [ -f server/Cargo.toml ]; then
            cargo test --manifest-path server/Cargo.toml --all
          else
            echo "No Cargo.toml yet — skipping tests"
          fi


  audio-lab:
    name: Audio Lab L1/L2 (SIMULATED)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Audio Lab L1/L2 tests
        run: |
          cargo test --manifest-path server/Cargo.toml --test audio_lab_l1_l2 -- --nocapture 2>&1 | tee /tmp/audio-lab-results.txt
          grep -c 'evidence_level.*SIMULATED' /tmp/audio-lab-results.txt || true
      - name: Verify L1/L2 evidence markers
        run: |
          # Confirm all tests emitted SIMULATED evidence markers
          grep -E 'lab_profile.*L[12]' /tmp/audio-lab-results.txt
          echo 'Audio Lab L1/L2 evidence markers present'
  rust-security-audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache advisory database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/advisory-db
          key: cargo-advisory-db-${{ github.run_id }}
          restore-keys: |
            cargo-advisory-db-

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Security audit
        run: |
          if [ -f server/Cargo.lock ]; then
            # RUSTSEC-2023-0071: rsa crate (Marvin Attack) — transitively pulled by
            # jsonwebtoken/rust_crypto. Open IEM uses EdDSA only; prove no RSA/HS
            # JWT algorithm is configured before accepting this documented residual.
            ! grep -RE 'Algorithm::(RSA|HS|ES|RS|PS)' server/api-server/src/auth.rs
            grep -q 'Algorithm::EdDSA' server/api-server/src/auth.rs
            # Retry fetch once on network failure; --db path reuses cache when available.
            cargo audit --file server/Cargo.lock --ignore RUSTSEC-2023-0071 \
              || cargo audit --file server/Cargo.lock --ignore RUSTSEC-2023-0071
          else
            echo "No Cargo.lock yet — skipping audit"
          fi

  rust-build-x86:
    name: Rust Build (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build
        run: |
          if [ -f server/Cargo.toml ]; then
            cargo build --manifest-path server/Cargo.toml --release
          else
            echo "No Cargo.toml yet — skipping build"
          fi

  rust-build-arm64:
    name: Rust Build (ARM64 cross)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable + ARM64 target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation toolchain
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (ARM64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [ -f server/Cargo.toml ]; then
            cargo build --manifest-path server/Cargo.toml --target aarch64-unknown-linux-gnu --release
          else
            echo "No Cargo.toml yet — skipping ARM64 build"
          fi

  frontend-musician:
    name: Frontend Musician (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache-dependency-path: web/musician/package-lock.json

      - name: Install deps
        run: npm ci --prefix web/musician

      - name: Typecheck
        run: npm run typecheck --prefix web/musician

      - name: Test
        run: npm test --prefix web/musician -- --run

      - name: Build
        run: |
          if [ -f web/musician/package.json ]; then
            npm run build --prefix web/musician
          fi

  frontend-engineer:
    name: Frontend Engineer (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache-dependency-path: web/engineer/package-lock.json

      - name: Install deps
        run: npm ci --prefix web/engineer

      - name: Typecheck
        run: npm run typecheck --prefix web/engineer

      - name: Test
        run: npm test --prefix web/engineer -- --run

      - name: Build
        run: |
          if [ -f web/engineer/package.json ]; then
            npm run build --prefix web/engineer
          fi

  validate-skills:
    name: Validate Agent Skills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run skill validation
        run: bash scripts/validate-skills.sh

  python-security-tests:
    name: Python Release Archive Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'

      - name: Test release archive and bundle validators
        run: python -m pytest -q tests/test_validate_release_archive.py tests/test_verify_release_signature.py tests/test_validate_release_bundle.py

  npm-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Audit musician frontend
        run: |
          if [ -f web/musician/package-lock.json ]; then
            npm audit --audit-level=high --prefix web/musician
          else
            echo "No package-lock.json yet — skipping musician audit"
          fi

      - name: Audit engineer frontend
        run: |
          if [ -f web/engineer/package-lock.json ]; then
            npm audit --audit-level=high --prefix web/engineer
          else
            echo "No package-lock.json yet — skipping engineer audit"
          fi

  documentation:
    name: Documentation and package gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y mupdf-tools

      - name: Validate documentation
        run: bash scripts/validate-docs.sh

      - name: Validate Musician Guide PDF
        run: bash scripts/validate-pdf.sh

      - name: Validate agent skills
        run: bash scripts/validate-skills.sh

      - name: Check whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          elif [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${BEFORE_SHA}...${HEAD_SHA}"
          else
            git diff --check "${HEAD_SHA}^" "${HEAD_SHA}"
          fi

  coverage:
    name: Rust Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Generate coverage report
        run: |
          cargo llvm-cov --manifest-path server/Cargo.toml --all --summary-only
          mkdir -p coverage
          cargo llvm-cov --manifest-path server/Cargo.toml --all --lcov --output-path coverage/lcov.info
          test -s coverage/lcov.info

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 30

  alsa-sim:
    name: ALSA Simulation (Docker + software PCM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub-hosted Azure runners do not guarantee snd-dummy or /dev/snd.
      # Use ALSA userspace `null` PCM in CI. Real USB/Raspberry Pi validation
      # remains a separate hardware gate and uses hw:N,M after `aplay -l`.
      - name: Select software-only ALSA mode
        run: echo "ALSA_SIM_MODE=null" >> "$GITHUB_ENV"

      - name: Verify Docker is available
        run: docker info

      - name: Verify ALSA fallback contract
        run: |
          test "$ALSA_SIM_MODE" = null
          echo "CI audio mode: software-only ALSA null PCM"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.x'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'

      - name: Build alsa-sim image
        run: docker build -t open-iem-alsa-sim deployment/docker/alsa-sim/

      - name: Smoke — ALSA device list inside container
        run: |
          docker run --rm -e ALSA_SIM_MODE=null \
            --entrypoint aplay open-iem-alsa-sim -L

      - name: Smoke — play test tone (software null PCM)
        run: |
          docker run --rm -e ALSA_SIM_MODE=null \
            open-iem-alsa-sim null

      - name: pytest suite
        run: python -m pytest -v deployment/docker/alsa-sim/test_alsa_sim.py
